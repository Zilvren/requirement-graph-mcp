name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Must run before setup-node: pnpm is declared via the packageManager
      # field and setup-node locates pnpm on PATH (pnpm/action-setup reads the
      # pinned version from package.json, so no version input is needed).
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
